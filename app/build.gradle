plugins { id 'com.android.application' }
android {
 namespace 'cn.vastudents.app'
 compileSdk 36
 compileSdkMinor 1
 defaultConfig { applicationId 'cn.vastudents.app'; minSdk 26; targetSdk 36; versionCode 1; versionName '0.1.0'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }

 flavorDimensions 'environment'
 productFlavors {
  preview { dimension 'environment'; buildConfigField 'boolean', 'DEVELOPMENT_FEATURES', 'false' }
  dev { dimension 'environment'; applicationIdSuffix '.dev'; versionNameSuffix '-dev'; buildConfigField 'boolean', 'DEVELOPMENT_FEATURES', 'true' }
 }
 buildFeatures { buildConfig true }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 buildTypes { release { minifyEnabled false; buildConfigField 'boolean', 'DEVELOPMENT_FEATURES', 'false' } }
 lint { abortOnError true; checkReleaseBuilds true }
}
dependencies {
 implementation 'com.google.zxing:core:3.5.3'
 testImplementation 'junit:junit:4.13.2'
 androidTestImplementation 'androidx.test:runner:1.7.0'
 androidTestImplementation 'androidx.test.ext:junit:1.3.0'
 androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
